[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-link-classifier"
version = "0.1.0"
description = "Offline phishing URL classifier using scikit-learn"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Phishing Link Classifier Contributors"}]

dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "tldextract>=5.0.0",
    "idna>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
phish-clf = "src.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
target-version = 'py39'

[tool.ruff.select]
E = ["E4", "E7", "E9"]
F = ["F401", "F402", "F403", "F405", "F407", "F501", "F502", "F504", "F505", "F506", "F507", "F601", "F602", "F607", "F621", "F622", "F631", "F632", "F633", "F634", "F701", "F702", "F704", "F706", "F712", "F811", "F821", "F822", "F823", "F841", "F901", "F909"]
I = []
N = []
D = []

[tool.ruff.ignore]
E501 = []
E203 = []
W503 = []